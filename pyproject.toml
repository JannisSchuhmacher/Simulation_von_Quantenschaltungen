[project]
name = "simulation-von-quantenschaltungen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ipykernel>=6.31.0",
    "numpy>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = [".venv", "local"]

[tool.ruff.lint]
extend-select = ["NPY"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
